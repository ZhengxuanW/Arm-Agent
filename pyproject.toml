[project]
name = "mycobot-sorting-package"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.1.3",
    "numpy>=2.4.6",
    "opencv-python>=4.13.0.92",
    "pymycobot",
]

[tool.uv]
package = false

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
